<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Cards</title>
  </head>
  <body>
    <main>
      <form class="contact-form">
        <h2>Kontakta oss / Beställning</h2>

        <!-- Textfält för Namn -->
        <div class="form-group">
          <label for="name">Namn</label>
          <input type="text" id="name" name="name" placeholder="Ditt namn" />
        </div>

        <!-- E-postfält -->
        <div class="form-group">
          <label for="email">E-post</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="din.epost@doman.se"
          />
        </div>

        <!-- Datumväljare -->
        <div class="form-group">
          <label for="date">Önskat datum</label>
          <input type="date" id="date" name="date" />
        </div>

        <!-- Dropdown / Select -->
        <div class="form-group">
          <label for="topic">Kategori</label>
          <select id="topic" name="topic">
            <option value="">-- Välj ett alternativ --</option>
            <option value="support">Support</option>
            <option value="order">Beställning</option>
            <option value="other">Övrigt</option>
          </select>
        </div>

        <!-- Radiobuttons / Alternativ -->
        <div class="form-group">
          <span class="group-label">Prioritet:</span>
          <div class="radio-group">
            <label
              ><input type="radio" name="priority" value="low" checked />
              Låg</label
            >
            <label
              ><input type="radio" name="priority" value="high" /> Hög</label
            >
          </div>
        </div>

        <!-- Meddelanderuta -->
        <div class="form-group">
          <label for="message">Meddelande</label>
          <textarea
            id="message"
            name="message"
            rows="4"
            placeholder="Skriv ditt meddelande här..."
          ></textarea>
        </div>

        <!-- Skicka-knapp -->
        <div class="cont">
          <button type="submit" class="btn-submit">Skicka</button>
        </div>
      </form>
    </main>
  </body>
</html>
